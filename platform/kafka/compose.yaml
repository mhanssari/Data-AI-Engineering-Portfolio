name: portfolio-kafka

x-kafka-image: &kafka-image apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7

services:
  kafka:
    image: *kafka-image
    hostname: kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      # A stable local cluster identity, not a credential. Never change it against an existing volume.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    mem_limit: 1536m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - clients
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    stop_grace_period: 30s

  # Optional CLI container: same pinned tools, no broker volume and no second broker process.
  tools:
    image: *kafka-image
    profiles: [tools]
    entrypoint: ["/bin/bash"]
    command: ["-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
    environment:
      KAFKA_HEAP_OPTS: -Xms32m -Xmx128m
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - clients

networks:
  clients:
    name: portfolio-kafka

volumes:
  kafka-data:
