# Case 06 only. Everything runs on the offline provider, so there is no API key and nothing here is a secret: the
# passwords below belong to throwaway service containers that exist for the length of the job.
name: Case 06 CI

on:
  push:
    paths:
      - "cases/06-p2p-agentic-reconciliation/**"
      - ".github/workflows/case-06-ci.yml"
  pull_request:
    paths:
      - "cases/06-p2p-agentic-reconciliation/**"
      - ".github/workflows/case-06-ci.yml"

permissions:
  contents: read

concurrency:
  group: case-06-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cases/06-p2p-agentic-reconciliation
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "55432"
      POSTGRES_DB: p2p
      POSTGRES_USER: p2p_admin
      POSTGRES_PASSWORD: ci-only-throwaway
      APP_DB_PASSWORD: ci-only-throwaway
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-only-throwaway
      LLM_PROVIDER: offline
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_DB: p2p
          POSTGRES_USER: p2p_admin
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U p2p_admin -d p2p"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      neo4j:
        image: neo4j:2026.09.0-community
        env:
          NEO4J_AUTH: neo4j/ci-only-throwaway
          NEO4J_server_memory_heap_initial__size: 512m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: cases/06-p2p-agentic-reconciliation/uv.lock

      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cases/06-p2p-agentic-reconciliation/data/models
          key: embedding-model-bge-small-en-v1.5

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Ontology and SHACL validation
        run: uv run pytest tests/test_ontology.py -q

      - name: Full pipeline from an empty database
        run: uv run p2p run-all

      - name: Data contracts against the database and their last release
        run: uv run p2p contracts-check

      - name: Agent evaluation, offline provider
        run: uv run p2p agent-eval

      - name: All tests
        run: uv run pytest -q
