[project]
name = "payment-reconciliation"
version = "0.1.0"
description = "Case 03: payment monitoring and settlement reconciliation on synthetic data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.9",
]

[project.scripts]
payrecon = "payrecon.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payrecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs the case's PostgreSQL (compose.yaml)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# The formatter owns line length; what remains over the limit is SQL text and messages, clearer unbroken.
ignore = ["E501"]
select = ["E", "F", "I", "B", "UP", "SIM"]
