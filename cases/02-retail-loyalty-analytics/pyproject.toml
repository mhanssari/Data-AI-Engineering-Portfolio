[project]
name = "retail-loyalty"
version = "0.1.0"
description = "Case 02: retail loyalty analytics warehouse with dbt on DuckDB, built from seeded synthetic extracts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact pins for the warehouse stack: the adapter, not dbt-core, is the binding constraint, and
# dbt-duckdb has not stated support for DuckDB 2.x, so DuckDB stays on the latest 1.x.
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
    "duckdb==1.5.6",
]

[project.scripts]
loyalty = "loyalty.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loyalty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# The formatter owns line length; what remains over the limit is SQL text and messages, clearer unbroken.
ignore = ["E501"]
select = ["E", "F", "I", "B", "UP", "SIM"]
