name: retail_loyalty
version: "0.1.0"
profile: retail_loyalty

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

flags:
  # No usage telemetry from anyone's clone of a portfolio project.
  send_anonymous_usage_stats: false

models:
  retail_loyalty:
    staging:
      +materialized: view
      +schema: staging

snapshots:
  retail_loyalty:
    +schema: snapshots

data_tests:
  retail_loyalty:
    # Failing rows land in the audit schema, one table per test, so a failure can be inspected, not just counted.
    +store_failures: true
    +schema: audit
