name: retail_loyalty
version: "0.1.0"
profile: retail_loyalty

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target"]

flags:
  # No usage telemetry from anyone's clone of a portfolio project.
  send_anonymous_usage_stats: false

on-run-end:
  - "{{ dq_test_result_ddl() }}"
  - "{{ record_test_results(results) }}"

vars:
  # The calendar covers the observation period. The as-of date is the latest transaction loaded unless this
  # variable is set, e.g. --vars '{as_of_date: 2026-09-16}'.
  calendar_start_date: "2024-10-01"
  calendar_end_date: "2026-09-30"
  as_of_date: null

models:
  retail_loyalty:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      # Column names and types are a promise to the report: a change that breaks it fails the build.
      +contract:
        enforced: true

snapshots:
  retail_loyalty:
    +schema: snapshots

data_tests:
  retail_loyalty:
    # Failing rows land in the audit schema, one table per test, so a failure can be inspected, not just counted.
    +store_failures: true
    +schema: audit
