# Hand-labelled retrieval questions for the default seed. evaluate_retrieval stops if a label names a chunk that no
# longer exists, so a change to the corpus cannot silently invalidate these.
#
# Questions are phrased as a clerk would ask them, and avoid repeating the wording of the chunk they should find.
# kind:
#   rule        a group policy rule
#   supplier    a named supplier's contract; the clauses are nearly identical, so the name has to decide it
#   procedure   a company's local procedure, or an audit memo
#   email       what a supplier or clerk wrote, found from what it is about
#   anchored    about "this invoice": the question names no supplier, and only the graph connects the two
questions:
  - { id: rule-01, kind: rule, user: ap_gb01, question: "How far over the order price can an invoice go before we stop it?", expected: [policy_p2p:price-tolerance-pct-default] }
